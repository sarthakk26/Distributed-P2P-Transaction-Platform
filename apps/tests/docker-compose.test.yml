version: '3.8'

services:
  test-db:
    image: postgres:15-alpine
    container_name: wallet-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: wallet_test
    ports:
      - "5433:5432"   # 5433 on host so it never clashes with your dev DB on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d wallet_test"]
      interval: 2s
      timeout: 5s
      retries: 10
