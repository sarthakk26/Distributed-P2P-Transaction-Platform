name: Integration Tests

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]

jobs:
    # JOB 1 — P2P Transfer Tests
    p2p-tests:
        name: P2P Transfer Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpassword
                    POSTGRES_DB: wallet_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/wallet_test
            BANK_WEBHOOK_SECRET: test-secret-do-not-use-in-prod
            NODE_ENV: test
        
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with: 
                    node-version: 20
                    cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Run Prisma migrations
              run : npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma
            
            - name: Run P2P tests
              run : npx dotenv -e .env.test -- npx vitest run integration/p2p/p2p.test.ts
              working-directory: apps/tests
    
    # JOB 2 — On-Ramp Webhook Tests
    onramp-tests:
        name: On-Ramp Webhook Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpassword
                    POSTGRES_DB: wallet_test
                ports:
                    - 5433:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 2s
                    --health-timeout 5s
                    --health-retries 10
                
        env:
            DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/wallet_test
            BANK_WEBHOOK_SECRET: test-secret-do-not-use-in-prod
            WEBHOOK_URL: http://localhost:3003/hdfcWebhook
            NODE_ENV: test

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
                cache: "npm"

            - name: Install dependencies
              run:  npm ci

            - name: Run Prisma Migrations
              run : npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma

            - name: Start bank-webhook service
              run : |
                    npx tsx src/index.ts &
                    echo "Waiting for webhook service to be ready..."
                    npx wait-on http://localhost:3003/health --timeout 15000
              working-directory: apps/bank-webhook

            - name: Run On-Ramp tests
              run : npx dotenv -e .env.test -- npx vitest run integration/onramp/onramp.test.ts
              working-directory: apps/tests