name: Deploy to EC2

on:
    push:
        branches: [main]


jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        # Only run after tests pass

        steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Log in to Docker Hub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN}}
        
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          # ── Build & push user-app

          - name: Build and push user-app
            uses: docker/build-push-action@v5
            with:
                context: .
                file: docker/Dockerfile.user-app
                push: true
                tags: sarth0x/cosmos-user-app:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max

          # ── Build & push bank-webhook
          - name: Build and push bank-webhook
            uses: docker/build-push-action@v5
            with:
                context: .
                file: docker/Dockerfile.bank-webhook
                push: true
                tags: sarth0x/cosmos-bank-webhook:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max

          # ── Build & push bank-server
          - name: Build and push bank-server
            uses: docker/build-push-action@v5
            with:
                context: .
                file: docker/Dockerfile.bank-server
                push: true
                tags: sarth0x/cosmos-bank-server:latest
                cache-from: type=gha
                cache-to: type=gha,mode=max

          # ── Deploy to EC2
          - name: Deploy to EC2
            uses: appleboy/ssh-action@v1.0.3
            with:
                host: ${{ secrets.EC2_HOST }}
                username: ubuntu
                key: ${{ secrets.EC2_SSH_KEY}}
                script: |
                    cd ~/app
                  
                    # Pull latest images
                    docker compose -f docker-compose.prod.yml pull

                    # Restart all services with zero-downtime
                    docker compose -f docker-compose.prod.yml up -d --remove-orphans
                  
                    # Clean up old images
                    docker image prune -f